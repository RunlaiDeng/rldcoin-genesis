[package]
name = "rld-regional-ledger-candidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[workspace]

[dependencies]
rld-core = { path = "../../crates/rld-core" }
serde = { version = "=1.0.216", features = ["derive"] }
